# 关闭空白 Issue，并把安全问题引导到私密漏洞报告入口，避免敏感信息直接出现在公开讨论区。
# 功能建议和缺陷仍从仓库的结构化模板进入，便于维护者获得可复现的信息。
blank_issues_enabled: false
contact_links:
