# 每周检查 npm 与 GitHub Actions 依赖，并限制同时打开的更新请求数量。
# 这里仅负责提出依赖升级，不绕过 CI、版本锁定和人工合并流程。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0 <8.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
